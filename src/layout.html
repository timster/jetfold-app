<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="https://jetfold.app/assets/screenshots/01-main-window.png">
<meta property="og:url" content="{{url}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fbfcfe" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071027" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="{{url}}">
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<link rel="stylesheet" href="/assets/site.css">
{{head}}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="wrap bar">
  <a class="brand" href="/"><img src="/assets/icon.png" alt="" width="34" height="34">Jetfold</a>
  <nav aria-label="Site">
    <a href="/features/"{{current-features}}>Features</a>
    <a href="/themes/"{{current-themes}}>Themes</a>
    <a href="/guide/"{{current-guide}}>Guide</a>
    <a href="/support/" class="hide-small"{{current-support}}>Support</a>
  </nav>
</header>

<main id="main">
{{content}}
</main>

<footer class="foot">
  <div class="wrap">
    <a class="brand small" href="/"><img src="/assets/icon.png" alt="" width="24" height="24">Jetfold</a>
    <nav aria-label="More">
      <a href="/features/">Features</a>
      <a href="/themes/">Themes</a>
      <a href="/guide/">Guide</a>
      <a href="/guide/shortcuts/">Keyboard shortcuts</a>
      <a href="/support/">Support</a>
      <a href="/privacy/">Privacy</a>
    </nav>
    <p>For macOS 14 and later. © {{year}} Tim Shaffer.</p>
  </div>
</footer>
</body>
</html>
